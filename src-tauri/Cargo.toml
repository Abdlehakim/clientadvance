[package]
name = "gestion-facile-desktop"
version = "0.1.0"
description = "Gestion Facile desktop shell"
edition = "2021"

[lib]
name = "gestion_facile_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
